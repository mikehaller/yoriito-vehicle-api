name: Generate Documentation

on:
  workflow_call:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Generate Github App Token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.RELEASE_BOT_ID }}
        private-key: ${{ secrets.RELEASE_BOT_KEY }}

    - uses: actions/checkout@v6
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: install dependencies
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends \
          build-essential \
          cmake \
          doxygen \
          graphviz

    - name: Generate Documentation
      run: |
        cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -DBUILD_COMMON=OFF -DBUILD_SIGNAL=OFF -DENABLE_TESTS=OFF -DENABLE_DOCS=ON
        cmake --build ${{github.workspace}}/build --target docs

    - name: Deploy Documentation
      run: |
        # cleanup
        rm -rf docs/html
        mkdir -p docs/html
        # deploy generated docs
        cp -r build/docs/html/common docs/html
        cp -r build/docs/html/signal docs/html

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ steps.app-token.outputs.token }}
        publish_dir: docs
        publish_branch: gh-pages
        enable_jekyll: true
        commit_message: "docs: auto-generated documentation [skip ci]"
        cname: ${{ vars.CUSTOM_DOMAIN }}
