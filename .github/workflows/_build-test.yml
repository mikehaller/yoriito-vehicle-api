name: Build and Test on devcontainer(desktop environment)

on:
  workflow_call:

jobs:
  build:
    name: Build and Test
    runs-on: LargeSizeRunner
    steps:
    - uses: actions/checkout@v6

    - name: docker login
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Start Docker Container
      run: |
        docker container run -d \
          --name builder \
          -v "${{ github.workspace }}:/work" \
          -w /work \
          --entrypoint /init \
          --cap-add NET_ADMIN \
          ${{ vars.DEVCONTAINER_IMAGE }}

        echo "Waiting for s6 services to start..."
        for i in $(seq 1 ${{ vars.SERVICE_WAIT_SEC }}); do
          if docker exec builder grep -q "0100007F:${{ vars.LISTEN_PORT_HEX }}" /proc/net/tcp 2>/dev/null; then
            echo "Services ready (attempt ${i})"
            break
          fi
          sleep 1
        done
        if ! docker exec builder grep -q "0100007F:${{ vars.LISTEN_PORT_HEX }}" /proc/net/tcp 2>/dev/null; then
          echo "ERROR: Services not ready after ${{ vars.SERVICE_WAIT_SEC }}s"
          docker exec builder /bin/bash -lc '/command/s6-rc -a list' 2>/dev/null || true
          exit 1
        fi

    - name: Configure
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail
            cmake -S /work -B /work/build -DENABLE_TESTS=ON -DENABLE_INTEGRATION_TESTS=ON
          '

    - name: Build
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail
            cmake --build /work/build -j$(nproc)
          '

    - name: Unit Test
      continue-on-error: true
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail
            ctest --test-dir /work/build --output-junit /work/result.xml
          '

    - name: Integration Test
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail

            FEATURES=(
              features/get.feature
              features/set.feature
              features/subscribe.feature
              features/unsubscribe.feature
              features/inspect.feature
            )

            cd /work/test_integration
            for feature in "${FEATURES[@]}"; do
              echo "=== Starting server for ${feature} ==="
              /work/build/test_integration/test_integration 2>&1 &
              server_pid=$!

              echo "Waiting for wire server on :3902..."
              for i in $(seq 1 30); do
                if grep -q "0100007F:0F3E" /proc/net/tcp 2>/dev/null; then
                  echo "Wire server ready (attempt ${i})"
                  break
                fi
                if ! kill -0 "${server_pid}" 2>/dev/null; then
                  echo "ERROR: Server process died for ${feature}"
                  exit 1
                fi
                sleep 1
              done
              if ! grep -q "0100007F:0F3E" /proc/net/tcp 2>/dev/null; then
                echo "ERROR: Wire server not listening after 30s for ${feature}"
                exit 1
              fi

              echo "=== Running ${feature} ==="
              timeout 15m cucumber --format progress --publish-quiet "${feature}"

              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
              sleep 2
            done
          '

    - name: Stop Docker Container
      if: always()
      run: |
        docker rm -f builder
